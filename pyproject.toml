[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-palette-generator"
version = "0.1.0"
description = "Generate images by sampling pixels from configurable color palettes."
readme = "README.md"
authors = [{name = "Pixel Palette Contributors"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0",
]

[project.optional-dependencies]
extras = ["numpy>=1.24"]

default = []

[project.scripts]
pixelgen = "src.pixelgen:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
